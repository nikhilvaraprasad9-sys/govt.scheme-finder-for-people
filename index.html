<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Government Scheme Finder</title>
<style>
body{font-family:Arial,sans-serif;background:#f0f4f8;margin:0;text-align:center;color:#243047}
header{background:#075e54;color:white;padding:25px}
.container{background:white;max-width:650px;margin:30px auto;padding:24px;border-radius:12px;box-shadow:0 4px 12px #ccc}
input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:6px;border:1px solid #ccc;box-sizing:border-box}
button{background:#075e54;color:white;cursor:pointer;font-size:16px}
.scheme{border:1px solid #cbd5d1;border-radius:9px;padding:15px;margin:12px 0;text-align:left}
.scheme button{width:auto;padding:10px 15px}
.details{background:#f0f7f5;padding:12px;border-radius:7px;margin-top:10px}
#result{text-align:left;margin-top:20px}
small{display:block;color:#52615e}
</style>
</head>
<body>
<header>
<h1>Government Scheme Finder 🇮🇳</h1>
<p>Discover schemes that may suit you.</p>
</header>

<div class="container">
<h2>Find Suitable Schemes</h2>
<label for="category">Select your category:</label>
<select id="category">
    <option value="" selected disabled>-- Select your category --</option>
    <option value="student">Student</option>
    <option value="farmer">Farmer</option>
    <option value="woman">Woman</option>
    <option value="business">Business Owner</option>
</select>
<button onclick="checkEligibility()">Find Schemes</button>
<div id="result" aria-live="polite"></div>
</div>

<div class="container">
<h2>Basic Eligibility Checker</h2>
<p>Answer these questions for general guidance. This is not an official eligibility decision.</p>
<label for="age">Your age:</label>
<input id="age" type="number" min="1" max="120" placeholder="Enter age">
<label for="income">Annual family income (₹):</label>
<input id="income" type="number" min="0" placeholder="Enter annual income">
<label for="state">State or Union Territory:</label>
<input id="state" type="text" placeholder="e.g. Andhra Pradesh">
<button onclick="checkEligibility()">Check Guidance</button>
<div id="eligibility" aria-live="polite"></div>
</div>

<script>
const schemes = {
student: [
{name:"National Scholarship Portal",detail:"Find scholarships offered by central and state authorities. Requirements vary by scholarship.",url:"https://scholarships.gov.in/"},
{name:"AICTE Scholarships",detail:"Explore AICTE scholarship opportunities and check the current scheme requirements.",url:"https://www.aicte-india.org/"}
],
farmer: [
{name:"PM-KISAN",detail:"Income-support scheme for eligible landholding farmer families, subject to official exclusions and verification.",url:"https://pmkisan.gov.in/"},
{name:"Pradhan Mantri Fasal Bima Yojana",detail:"Crop insurance information. Availability and eligibility depend on notified crops, areas and current rules.",url:"https://pmfby.gov.in/"}
],
woman: [
{name:"Pradhan Mantri Matru Vandana Yojana",detail:"Maternity benefit scheme for eligible applicants under current rules.",url:"https://pmmvy.wcd.gov.in/"},
{name:"Women and Child Development",detail:"Explore official women and child welfare information and services.",url:"https://wcd.gov.in/"}
],
business: [
{name:"Pradhan Mantri MUDRA Yojana",detail:"Information about loans for eligible non-corporate, non-farm small and micro enterprises.",url:"https://www.mudra.org.in/"},
{name:"Prime Minister's Employment Generation Programme",detail:"Explore the scheme and its current eligibility, project and application requirements.",url:"https://www.kviconline.gov.in/pmegpeportal/"}
]
};


function findSchemes(){
    const category = document.getElementById("category").value;

    if (!category) {
        alert("Please select a category first!");
        return;
    }

    const result = document.getElementById("result");
result.innerHTML="<h3>Suggested schemes</h3>";
schemes[category].forEach((s,i)=>{
const card=document.createElement("div");
card.className="scheme";
const title=document.createElement("h3");
title.textContent=s.name;
const description=document.createElement("p");
description.textContent=s.detail;
const button=document.createElement("button");
button.textContent="View details";
button.onclick=()=>{
let old=card.querySelector(".details");
if(old){old.remove();button.textContent="View details";return;}
const details=document.createElement("div");
details.className="details";
const p=document.createElement("p");
p.textContent=s.detail;
const link=document.createElement("a");
link.href=s.url;
link.target="_blank";
link.rel="noopener noreferrer";
link.textContent="Visit official website";
details.append(p,link);
card.appendChild(details);
button.textContent="Hide details";
};
card.append(title,description,button);
result.appendChild(card);
});
const note=document.createElement("p");
note.textContent="These are suggestions, not confirmation of eligibility. Verify current rules on the official website.";
result.appendChild(note);
}

function checkEligibility() {
    const ageValue = document.getElementById("age").value;
    const incomeValue = document.getElementById("income").value;
    const stateValue = document.getElementById("state").value.trim();
    const output = document.getElementById("eligibility");

    output.innerHTML = "";

    const age = Number(ageValue);
    const income = Number(incomeValue);

    if (
        ageValue === "" ||
        incomeValue === "" ||
        stateValue === "" ||
        !Number.isFinite(age) ||
        !Number.isFinite(income) ||
        age < 1 ||
        age > 120 ||
        income < 0
    ) {
        output.textContent =
            "Please enter a valid age, annual family income, and state.";
        return;
    }

    const heading = document.createElement("h3");
    heading.textContent = "Your Eligibility Guidance";
    output.appendChild(heading);

    const intro = document.createElement("p");
    intro.textContent =
        "Based on the details entered, here are schemes you can investigate. Final eligibility depends on each scheme's official rules.";
    output.appendChild(intro);

    const suggestions = [];

    if (age >= 18 && age <= 25) {
        suggestions.push({
            name: "National Scholarship Portal",
            detail:
                "Check available student scholarships. Eligibility depends on your course, marks, family income, and scheme-specific conditions.",
            url: "https://scholarships.gov.in/"
        });
    }

    if (income <= 250000) {
        suggestions.push({
            name: "National Social Assistance Programme",
            detail:
                "Check whether any social assistance pension applies. Specific age, income, and other conditions vary by scheme.",
            url: "https://nsap.nic.in/"
        });
    }

    suggestions.push({
        name: "myScheme Government Scheme Finder",
        detail:
            "Use the official scheme discovery portal to explore schemes using your personal details and check their eligibility criteria.",
        url: "https://www.myscheme.gov.in/"
    });

    const stateNote = document.createElement("p");
    stateNote.textContent = "State entered: " + stateValue;
    output.appendChild(stateNote);

    suggestions.forEach(function (scheme) {
        const card = document.createElement("div");
        card.className = "scheme";

        const title = document.createElement("h4");
        title.textContent = scheme.name;

        const detail = document.createElement("p");
        detail.textContent = scheme.detail;

        const link = document.createElement("a");
        link.href = scheme.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Check Official Website";

        card.append(title, detail, link);
        output.appendChild(card);
    });

    const note = document.createElement("p");
    note.textContent =
        "Important: These are suggestions, not confirmed eligibility results. Verify age, income, residence, and other requirements on the official websites.";
    output.appendChild(note);
}
</script>
</body>
</html>
